# Settings for pytest (our testing tool).
[tool.pytest.ini_options]
# Lets test files write "from tools import ..." because Python will
# also look for modules in this folder (".").
pythonpath = ["."]
# Only look for tests inside the "tests" folder.
testpaths = ["tests"]
# Custom marker: tests that call the real API (skipped unless RUN_LIVE_TESTS=1).
markers = ["live: makes a real, billed API request"]
